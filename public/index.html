    <title>Thingual</title>
    <meta name="description" content="Learn languages by photographing the things around you." />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #FAFAF8; }
      #root { display: flex; height: 100%; flex: 1; }
      @media (prefers-color-scheme: dark) { body { background: #0E0E0E; } }
      /* lightweight splash shown until the app mounts */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Georgia, serif; color: #141414; }
      @media (prefers-color-scheme: dark) { #boot { color: #F2F2F0; } }
      #boot svg { width: 44px; height: 55px; animation: flick 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
      #boot span { font-size: 30px; letter-spacing: -.3px; }
      @keyframes flick { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06, 1.1) translateY(-2px) } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 80"><path d="M32 2C36 16 52 27 52 49C52 67 43 78 32 78C21 78 12 67 12 51C12 39 18 31 22 24C23 32 26 36 30 38C28 26 29.5 12 32 2Z" fill="#FF6B35"/><path d="M33 35C36 44 44 50 44 60C44 70 39 76 32 76C25 76 20 70 20 62C20 55 24 50 27 46C28 52 30 54 32 55C31 48 31 41 33 35Z" fill="#FFC94D"/></svg>
      <span>Thingual</span>
    </div>
    <div id="root"></div>
  </body>
</html>
