<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Thingual</title>
    <meta name="description" content="Learn languages by photographing the things around you." />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B2129" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Thingual" />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" href="/logo-mark.webp" as="image" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #FAFAF8; }
      #root { display: flex; height: 100%; flex: 1; }
      @media (prefers-color-scheme: dark) { body { background: linear-gradient(135deg,#0E3B32,#0B2238 55%,#0A1A33); } }
      /* lightweight splash shown until the app mounts */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Georgia, serif; color: #141414; }
      @media (prefers-color-scheme: dark) { #boot { color: #F2F2F0; } }
      #boot img { width: 72px; height: 72px; animation: pulse 1.4s ease-in-out infinite; }
      #boot span { font-size: 30px; letter-spacing: -.3px; }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot" aria-hidden="true">
      <img src="/logo-mark.webp" width="72" height="72" alt="" />
      <span>Thingual</span>
    </div>
    <div id="root"></div>
  </body>
</html>
